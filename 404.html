<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Página não encontrada · Mentalize Joias</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fefdf2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2b1d">

  <!-- tokens.css entra só pelo @font-face da Avenir (a fonte da marca vale
       também aqui); as cores desta página são próprias, em pagina-404.css. -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/pagina-404.css">
  <!--
    Este arquivo entra em cena sempre que alguém acessa um caminho que não
    existe (ex.: um link ou URL digitada errada, tipo /sobr.html). Este site
    tem múltiplas páginas reais, então isso é um caso genuíno e frequente —
    por isso o link de volta abaixo é tratado como parte da experiência.
  -->
</head>
<body>
  <div class="caixa">
    <h1>Página não encontrada</h1>
    <p>O caminho <code id="caminho"></code> não existe neste site.</p>
    <p><a id="link-inicio" class="botao-inicio" href="./">Voltar ao início</a></p>
    <p class="aviso-redirecionamento">Redirecionando automaticamente em instantes…</p>
  </div>
  <script src="./js/pagina-404.js"></script>
</body>
</html>
